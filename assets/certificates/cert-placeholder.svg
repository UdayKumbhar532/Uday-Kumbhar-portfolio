<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#cbg)"/>
  <!-- Certificate icon -->
  <rect x="140" y="60" width="120" height="90" rx="6" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="2"/>
  <line x1="160" y1="90" x2="240" y2="90" stroke="rgba(124,58,237,0.25)" stroke-width="2"/>
  <line x1="170" y1="105" x2="230" y2="105" stroke="rgba(124,58,237,0.2)" stroke-width="2"/>
  <line x1="175" y1="120" x2="225" y2="120" stroke="rgba(124,58,237,0.15)" stroke-width="2"/>
  <circle cx="200" cy="145" r="8" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="1.5"/>
  <!-- Text -->
  <text x="200" y="200" text-anchor="middle" fill="rgba(124,58,237,0.6)" font-family="Arial, sans-serif" font-size="15" font-weight="600">CERTIFICATE</text>
  <text x="200" y="225" text-anchor="middle" fill="rgba(124,58,237,0.4)" font-family="Arial, sans-serif" font-size="11">Replace with your certificate image</text>
  <!-- Border -->
  <rect x="2" y="2" width="396" height="296" rx="12" fill="none" stroke="rgba(124,58,237,0.12)" stroke-width="1.5"/>
</svg>
